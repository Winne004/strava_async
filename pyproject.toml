[project]
name = "strava-async"
version = "0.1.0"
description = "Async Python client for the Strava API v3"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.2",
    "aiolimiter>=1.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "tenacity>=9.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strava_async"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ty.src]
include = ["src", "tests"]
